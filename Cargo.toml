[package]
name = "danbooru-channel-bot"
version = "2.0.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
env_logger = "0.11.11"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
log = "0.4.34"
rand = "0.10.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
teloxide = { version = "0.17", default-features = false, features = ["rustls", "ctrlc_handler", "webhooks-axum"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "time", "sync"] }
url = "2.5.8"

# Optimize dependencies in dev builds, image processing in tests is slow otherwise
[profile.dev.package."*"]
opt-level = 2
